<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Day Planner</title>
  <meta name="theme-color" content="#d9603b" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Planner" />
  <script>try{var t=localStorage.getItem("elevate-planner-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Day Planner</h1>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <button data-tab="today" class="tab active" role="tab" aria-selected="true">Today</button>
      <button data-tab="week" class="tab" role="tab" aria-selected="false">Week</button>
      <button data-tab="workout" class="tab" role="tab" aria-selected="false">Workout</button>
      <button data-tab="meds" class="tab" role="tab" aria-selected="false">Meds</button>
      <button data-tab="about" class="tab" role="tab" aria-selected="false">About</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="footnote">
    Not medical advice — a scheduling tool built from your own program plan. Confirm
    anything medication-related with your doctor/coach. Data stays on this device only.
  </footer>

  <script type="module" src="app.js"></script>
  <script type="module" src="boot.js"></script>
</body>
</html>
