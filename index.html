<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Day Planner</title>
  <meta name="theme-color" content="#d9603b" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Planner" />
  <script>try{var t=localStorage.getItem("elevate-planner-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Day Planner</h1>
  </header>

  <main id="app"></main>

  <footer class="footnote">
    Not medical advice — a scheduling tool built from your own program plan. Confirm
    anything medication-related with your doctor/coach. Data stays on this device only.
  </footer>

  <div class="more-backdrop" id="more-backdrop" hidden></div>
  <div class="more-sheet" id="more-sheet" role="menu" aria-label="More sections" hidden>
    <button type="button" role="menuitem" class="more-item" data-tab="week">Week</button>
    <button type="button" role="menuitem" class="more-item" data-tab="workout">Workout</button>
    <button type="button" role="menuitem" class="more-item" data-tab="meds">Meds</button>
    <button type="button" role="menuitem" class="more-item" data-tab="about">About</button>
  </div>
  <nav class="tabbar" id="tabs" role="tablist" aria-label="Sections">
    <button data-tab="today" class="tab active" role="tab" aria-selected="true"><span class="tab-ico" aria-hidden="true">🏠</span><span class="tab-txt">Today</span></button>
    <button data-tab="log" class="tab" role="tab" aria-selected="false"><span class="tab-ico" aria-hidden="true">📝</span><span class="tab-txt">Log</span></button>
    <button data-tab="insights" class="tab" role="tab" aria-selected="false"><span class="tab-ico" aria-hidden="true">📈</span><span class="tab-txt">Insights</span></button>
    <button data-tab="plan" class="tab" role="tab" aria-selected="false"><span class="tab-ico" aria-hidden="true">🗓️</span><span class="tab-txt">Plan</span></button>
    <button id="more-btn" class="tab" role="tab" aria-selected="false" aria-haspopup="menu" aria-expanded="false" aria-controls="more-sheet"><span class="tab-ico" aria-hidden="true">⋯</span><span class="tab-txt">More</span></button>
  </nav>

  <script type="module" src="app.js"></script>
  <script type="module" src="boot.js"></script>
</body>
</html>
