<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Day Planner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Day Planner</h1>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="tab active">Today</button>
      <button data-tab="week" class="tab">Week</button>
      <button data-tab="meds" class="tab">Meds</button>
      <button data-tab="about" class="tab">About</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer class="footnote">
    Not medical advice — a scheduling tool built from your own program plan. Confirm
    anything medication-related with your doctor/coach. Data stays on this device only.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
